# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE_EXTENSION.HANDSHAKE.CI
# TAG: LEEWAY.W01.OPERATING_SYSTEM.EXTENSION.CI.V2
# 5WH:
# WHAT = Qualify the native handshake, Operating System sidebar, tenant profile and unsigned browser packaging on each review.
# WHY = Reject uncorrelated host messages, stale sessions and cross-origin browser launch bypasses.
# WHO = Creator-authorized W01 contributor; GitHub Actions is test evidence, not Veritas.
# WHERE = .github/workflows/verify-native-handshake.yml.
# WHEN = 2026-11-19.
# HOW = Node syntax, VM-simulated native port/tenant negative tests and deterministic unsigned Chrome/Firefox ZIPs.
# LICENSE = Existing repository terms apply.
name: W01 Extension Native Handshake Source Tests
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'tests/**'
      - 'provisioning/**'
      - 'scripts/package-extension.py'
      - '.github/workflows/verify-native-handshake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check extension/browser-polyfill.js
          node --check extension/background.js
          node --check extension/content-courier.js
          node --check extension/floating-tablet.js
          node --check extension/operating-policy.js
          node --check extension/operating-system.js
          node --check provisioning/tenant-install-plan.mjs
          node --check tests/native-handshake.test.mjs
          node --check tests/operating-policy.test.mjs
          node --check tests/tenant-install-plan.test.mjs
      - name: Source negative tests
        run: npm test
      - name: Deterministic unsigned Chrome and Firefox source packages
        run: python3 scripts/package-extension.py
      - name: Upload unsigned source candidates (NOT production installed)
        uses: actions/upload-artifact@v4
        with:
          name: leeway-operating-system-UNSIGNED-source
          path: |
            dist/leeway-operating-system-chromium-UNSIGNED.zip
            dist/leeway-operating-system-firefox-UNSIGNED.zip
            dist/SHA256SUMS.json
          if-no-files-found: error
          retention-days: 7
